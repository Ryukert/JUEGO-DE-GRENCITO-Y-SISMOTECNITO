<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f6fc4" />
    <meta
      name="description"
      content="Juego educativo con Sismo Tecnito y Greencito: protección civil ante sismos y cuidado del medio ambiente para niñas y niños."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/webp" href="/greencito-cara.webp" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preload" as="image" href="/sismo.webp" />
    <link rel="preload" as="image" href="/greencito.webp" />

    <title>Escuadrón Tecnito y Greencito</title>
    <script>
      // tema antes de pintar, para que el modo oscuro no parpadee en blanco al abrir
      try {
        var t = localStorage.getItem("escuadron-tema");
        if (t !== "claro" && t !== "oscuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        document.documentElement.dataset.tema = t;
        var pref = JSON.parse(localStorage.getItem("escuadron-preferencias") || "{}");
        if (pref.letraGrande) document.documentElement.dataset.letra = "grande";
        if (pref.menosMovimiento) document.documentElement.dataset.movimiento = "reducido";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
